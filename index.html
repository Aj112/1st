<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="heart">❤</div>
    <h1>Would you go on a date with me?</h1>
    <p>I promise it will be unforgettable; just the two of us making memories together.</p>
    <button class="btn yes" onclick="sayYes()">Yes</button>
    <button class="btn no" id="noBtn">No</button>
  </div>
  <script src="main.js"></script>
</body>
</html>
